# 出力先
#   debug     : PC 画面にウィンドウ表示（projector の解像度と同じサイズ）。まずはこちらで正しく表現できるまで開発する
#   projector : プロジェクタ（monitor_name を名前に含むモニタ、無ければ monitor_index）にフルスクリーン出力
#               見つからなければウィンドウにフォールバック。--output projector で起動時に切り替えもできる
output: debug

# 操作パネル（PC の画面に出す 2 つ目のウィンドウ。出力のプレビュー・状態・キー一覧）
#   auto: output が projector のときだけ出す / on: いつも出す / off: 出さない
operator_window: auto

# プロジェクタ / 表示設定
# Optoma ML1050ST+ : DLP 0.45" DMD, ネイティブ WXGA 1280x800 (16:10), 投写比 0.8:1, 1000 lm
projector:
  name: "Optoma ML1050ST+"
  width: 1280            # ネイティブ解像度で出力する（スケーリングによるボケを避ける）
  height: 800
  refresh_rate: 60
  throw_ratio: 0.8       # 投写距離 / 画面幅
  monitor_name: "Optoma" # 名前にこれを含むモニタを使う。名前が取れない（Generic PnP Monitor）ときは
                         # 主モニタ以外で width×height のモニタを使う（--list-monitors で確認できる）
  monitor_index: 1       # monitor_name で見つからないときの番号（0 = ノートPC本体, 1 = プロジェクタ）
  flip_horizontal: false # リア投影時に true
  flip_vertical: false   # 天吊り / 天井投影の向き調整
  vsync: true

# 投影方式
projection:
  type: fisheye          # fisheye(天頂中心の等距離射影, 天井投影向け) | perspective(壁投影向け)
  fov_deg: 180           # fisheye: 地平線まで = 180
  center_alt_deg: 90     # 視線方向の高度（90 = 天頂）
  center_az_deg: 180     # 視線方向の方位（0 = 北, 180 = 南）
  rotation_deg: 0        # 映像全体の回転（設置向きの補正）。fisheye は円の外が黒になる

# 観測地（L / Shift+L キーで切り替え、--location <id> でも指定可）
location: osaka          # 起動時の観測地の id

locations:
  - id: osaka
    name: "大阪大学 吹田キャンパス"
    latitude_deg: 34.82
    longitude_deg: 135.52
    elevation_m: 50
    timezone_hours: 9          # JST
    limiting_magnitude: 4.0    # 街明かりで暗い星は見えない（郊外の都市の空）
    landscape: city            # 地平線の景色: none | mountains | city

  - id: achi
    name: "長野県 阿智村（ヘブンスそのはら）"
    latitude_deg: 35.47        # 富士見台高原の山頂付近（概略値。0.01° の差は表示に影響しない）
    longitude_deg: 137.63
    elevation_m: 1400
    timezone_hours: 9
    limiting_magnitude: 6.5    # 「日本一の星空」。肉眼の限界まで見える
    landscape: mountains

# 時間
time:
  start: "now"           # "now" または "2026-12-14 22:00"（観測地の地方時）
  speed: 1               # 実時間に対する倍率。speed_steps のいずれか
  # ↑/↓ キーで切り替える倍率の段階（1 = 実時間, 3600 = 1秒で1時間, 86400 = 1秒で1日）
  speed_steps: [1, 10, 60, 300, 600, 1800, 3600, 21600, 86400]

# 季節プリセット（S / Shift+S で巡回、F1〜 で直接ジャンプ）
# 並び順 = 巡回順。日付は毎年同じ月日・地方時として扱う
seasons:
  - { name: "春",   date: "04-15", time: "21:00" }
  - { name: "初夏", date: "06-10", time: "21:30" }
  - { name: "夏",   date: "08-10", time: "21:00" }
  - { name: "秋",   date: "10-20", time: "21:00" }
  - { name: "冬",   date: "01-20", time: "21:00" }

# 季節の自動巡回（T キーで ON/OFF）
season_tour:
  enabled: false
  interval_sec: 30       # 実時間で何秒ごとに次の季節へ進むか

# 起動時の表示モード（0〜9 キー / M キーで切り替え）
#   real | aurora | nebula | meteor | constellation | jewel | warp | milkyway | mirror
mode: real

# 星の描画（詳細は docs/rendering.md）
render:
  limiting_magnitude: 6.0     # 最暗等級の既定値（観測地で指定が無いとき・幻想モード）。薄明中は自動で下がる
  saturation_magnitude: 3.0   # これより明るい星は芯が飽和し、星像の大きさで明るさを表す
  star_size: 0.8              # 暗い星の星像の大きさ（ガウスの σ, 高さ 800px 基準の px）
  brightness: 1.0             # 星の明るさの倍率
  extinction: 0.25            # 大気減光係数 [等級/エアマス]（リアルモードのみ）。0 で無効
  exposure: 1.0               # 全体の露出
  gamma: 2.2                  # 出力ガンマ（プロジェクタに合わせて調整）
  moon_scale: 5.0             # 月・太陽を実際の何倍の大きさで描くか（実寸だと魚眼で直径 2px）
  bloom: 1.0                  # 光のにじみの強さ（モードごとの値に掛ける）。0 で無効
  font: ""                    # 日本語フォントのファイル。空なら BIZ UDゴシック → 游ゴシック → メイリオ の順に探す
  # 起動時の補助表示（キーでも切替）
  show_grid: false            # 高度・方位グリッド（G）
  show_compass: false         # 方位 北/東/南/西（C）
  show_constellations: false       # 星座線（K）
  show_constellation_names: false  # 星座名（K を 2 回）
  show_labels: false               # 星・惑星・月の名前（J）
  show_info: false            # 画面左下の日時・観測地・モード（I）

# シナリオ（P キーで再生 / 停止、--play で起動時に再生）
# 各場面は duration_sec 秒続き、書いた項目だけを変える
scenario:
  loop: true
  steps:
    - { duration_sec: 20, location: achi, time: "2026-12-15 16:30", speed: 600, mode: real,
        constellations: false, constellation_names: false, labels: false, message: "阿智村の冬の夕暮れ" }
    - { duration_sec: 20, speed: 60, constellations: true, constellation_names: true, labels: true,
        message: "冬の星座" }
    - { duration_sec: 15, mode: jewel, labels: false, constellations: false, constellation_names: false,
        message: "宝石箱" }
    - { duration_sec: 20, location: osaka, time: "2027-08-10 20:30", speed: 300, mode: real,
        message: "大阪の夏の空" }
    - { duration_sec: 20, location: achi, mode: milkyway, message: "阿智村の天の川" }
    - { duration_sec: 15, mode: meteor, speed: 60, message: "流星群" }
    - { duration_sec: 15, mode: aurora, message: "オーロラ" }
